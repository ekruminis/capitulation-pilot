[project]
name = "pressure-pilot"
version = "0.1.0"
description = "Pilot: do code-review monitors capitulate under multi-agent pressure?"
authors = [
    { name = "ekruminis", email = "e.kruminis@lancaster.ac.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "inspect-ai>=0.3.281",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openai>=3.31.0",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "ruff>=0.17.1",
    "statsmodels>=0.15.0",
]



[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:inspect_ai.*"]
